<svg width="1920" height="1080" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#764ba2;stop-opacity:1" />
    </linearGradient>
    <radialGradient id="grad2" cx="20%" cy="50%">
      <stop offset="0%" style="stop-color:#7877c6;stop-opacity:0.3" />
      <stop offset="100%" style="stop-color:#7877c6;stop-opacity:0" />
    </radialGradient>
    <radialGradient id="grad3" cx="80%" cy="80%">
      <stop offset="0%" style="stop-color:#5856d6;stop-opacity:0.3" />
      <stop offset="100%" style="stop-color:#5856d6;stop-opacity:0" />
    </radialGradient>
  </defs>
  
  <!-- Base gradient -->
  <rect width="1920" height="1080" fill="url(#grad1)"/>
  
  <!-- Overlay gradients for depth -->
  <rect width="1920" height="1080" fill="url(#grad2)"/>
  <rect width="1920" height="1080" fill="url(#grad3)"/>
  
  <!-- Grid pattern for tech feel -->
  <g opacity="0.1">
    <line x1="0" y1="270" x2="1920" y2="270" stroke="white" stroke-width="1"/>
    <line x1="0" y1="540" x2="1920" y2="540" stroke="white" stroke-width="1"/>
    <line x1="0" y1="810" x2="1920" y2="810" stroke="white" stroke-width="1"/>
    <line x1="480" y1="0" x2="480" y2="1080" stroke="white" stroke-width="1"/>
    <line x1="960" y1="0" x2="960" y2="1080" stroke="white" stroke-width="1"/>
    <line x1="1440" y1="0" x2="1440" y2="1080" stroke="white" stroke-width="1"/>
  </g>
  
  <!-- Floating circles for visual interest -->
  <circle cx="300" cy="200" r="80" fill="white" opacity="0.05"/>
  <circle cx="1600" cy="800" r="120" fill="white" opacity="0.05"/>
  <circle cx="800" cy="900" r="60" fill="white" opacity="0.05"/>
  <circle cx="1200" cy="300" r="90" fill="white" opacity="0.05"/>
</svg>
